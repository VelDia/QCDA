# Unit tests. A pull request must pass both suites on every Python version
# the README supports. The tests are offline: no API key and no network.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.requirements }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
        requirements: [requirements.txt]
        include:
          # The exact versions of the release (requirements.lock is for 3.12).
          - python-version: "3.12"
            requirements: requirements.lock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: data_availability_pipeline/v2/${{ matrix.requirements }}
      - name: Install the dependencies
        run: python -m pip install -r data_availability_pipeline/v2/${{ matrix.requirements }}
      - name: Pipeline tests
        working-directory: data_availability_pipeline/v2
        run: python -m pytest tests/ -q
      - name: Benchmark tests
        working-directory: benchmark
        run: python -m pytest tests/ -q
